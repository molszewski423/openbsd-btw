# OpenBSD autoinstall(8) response file - for the install79.img-based
# build (build-img.sh), not the ISO. "Location of sets" differs from
# install.conf's cd0: a raw USB/HDD image has no separate CD-ROM device
# to name - the sets live on the same disk being booted from, matching
# how install79.img is designed to self-install by default.
#
# IMPORTANT, learned by actually testing this: autoinstall does NOT fall
# back to an interactive prompt for a question you leave unanswered here -
# it hard-fails the whole install attempt ("Question has no answer in the
# response file... failed; check /tmp/ai/ai.log") and dumps back to the
# Install/Upgrade/Autoinstall/Shell menu. Every question the installer
# will actually ask needs an answer below, including hostname and
# passwords - there's no safe way to leave the genuinely per-machine
# stuff interactive. So: CHANGEME placeholders below are things you must
# edit before building an ISO for a real deployment, not things that will
# politely prompt you.
#
# Password lines take a bcrypt hash, not plaintext - generate with:
#   encrypt (on any OpenBSD box) or `mkpasswd`
# Do NOT commit a real hash here; this file is a template.

System hostname = CHANGEME
Password for root = CHANGEME_BCRYPT_HASH
Change the default console to com0 = no
What timezone are you in = America/Chicago
Use (A)uto layout, (E)dit auto layout, or create (C)ustom layout = a
# No user account here on purpose - autoinstall can't ask just this one
# question interactively (see note above). firstboot.sh creates a
# temporary bootstrap account instead, then a graphical (X11) prompt
# collects the real username/password and renames it into place - see
# firstboot.sh and onetime-account-setup.sh. That's what lets one built
# ISO work for anyone, not just a hardcoded account baked in at build time.
Setup a user = no
Location of sets = disk
Directory does not contain SHA256.sig. Continue without verification? = yes
Set name(s) = +*
