---
# Provisions a fresh OpenBSD install into the cwm/oxwm Tokyo Night desktop.
# Usage: uncomment/add your target host in inventory.ini, then:
#   ansible-playbook site.yml -k -K   (password auth + doas password prompt)
#
# Idempotent - safe to re-run.

- name: OpenBSD desktop setup
  # "all" rather than "openbsd_desktops" so this also matches the ad-hoc
  # localhost inventory firstboot.sh uses for self-provisioning
  # (-i "localhost," doesn't put that host in any named group).
  hosts: all
  become: true
  become_method: community.general.doas

  pre_tasks:
    # Ansible needs a Python interpreter on the target before any module
    # other than raw/shell/script will work. OpenBSD has no Python in the
    # base install, so bootstrap it with raw first.
    - name: Check for python3
      ansible.builtin.raw: test -x /usr/local/bin/python3
      register: python_check
      changed_when: false
      failed_when: false

    - name: Bootstrap python3 (needed for all other Ansible modules)
      ansible.builtin.raw: pkg_add python-3.13.14
      when: python_check.rc != 0

  roles:
    - packages
    - dotfiles
    - fonts
    - theming
    - oxwm-build
    - services

  post_tasks:
    # Every preceding role runs under become:true (root), and none of their
    # file/copy tasks set an explicit owner - so everything they wrote into
    # $HOME (dotfiles, zig, the wallpaper, Pictures/, ...) ended up owned by
    # root instead of the actual account. A one-shot recursive chown here
    # is simpler and more robust than adding owner/group to every task
    # across every role (and catches anything a future role adds too).
    - name: Ensure the whole home directory is owned by the account, not root
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true
