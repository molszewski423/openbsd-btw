---
# The dotfiles/ tree at the repo root mirrors $HOME structure, one
# subdirectory per concern - EXCEPT bin/, whose contents are meant to land
# in a ~/bin/ subdirectory, not directly at ~ like the others' dotfiles
# (.cwmrc, .xsession, etc.) do. Copying it with the same dest: "~/" as
# everything else silently placed pkg_add/set-wm/sync-cwm-menu/urxvt-fish
# directly in $HOME instead - the actual root cause of what looked like a
# missing-file mystery in the oxwm-build role (its "Symlink zig into
# ~/bin" task failed with "No such file or directory" because ~/bin
# itself never existed, not because zig was missing - the error message
# names both paths, which reads misleadingly like a source-side problem).
- name: Copy dotfiles into place
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dotfiles/{{ item }}/"
    dest: "/home/{{ ansible_user }}/"
    mode: preserve
  loop:
    - cwm
    - oxwm
    - shell
    - x11
    - gtk
    - rofi
    - dunst
    - picom

- name: Copy bin/ scripts into ~/bin
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dotfiles/bin/"
    dest: "/home/{{ ansible_user }}/bin/"
    mode: preserve

- name: Clone neovim config
  ansible.builtin.git:
    repo: https://github.com/tonybanters/nvim
    dest: "/home/{{ ansible_user }}/.config/nvim"
    depth: 1
  register: nvim_clone
  failed_when: false

- name: Bootstrap neovim plugins (headless, triggers its own git clones)
  ansible.builtin.command: nvim --headless "+qa"
  when: nvim_clone is succeeded
  changed_when: false
  failed_when: false

- name: Write codecompanion.nvim config (Ollama on MikePC, no API key needed)
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.config/nvim/lua/config/codecompanion.lua"
    mode: "0644"
    content: |
      require("codecompanion").setup({
        adapters = {
          http = {
            extend = {
              ollama = {
                env = {
                  url = "http://100.97.45.57:11434",
                },
                schema = {
                  model = {
                    default = "devstral:24b",
                  },
                },
              },
            },
          },
        },
        strategies = {
          chat = { adapter = "ollama" },
          inline = { adapter = "ollama" },
          cmd = { adapter = "ollama" },
        },
      })

- name: Add codecompanion.nvim to plugin-list.lua
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.config/nvim/lua/plugin-list.lua"
    line: '    "olimorris/codecompanion.nvim",'
    insertafter: '"nvim-lua/plenary.nvim",'
  when: nvim_clone is succeeded

- name: Add codecompanion require to init.lua
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.config/nvim/init.lua"
    line: 'require("config.codecompanion")'
  when: nvim_clone is succeeded
