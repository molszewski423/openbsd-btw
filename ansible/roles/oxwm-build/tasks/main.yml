---
# oxwm's runtime config (~/.config/oxwm/config.lua) is handled by the
# dotfiles role. This role only builds the binary itself.

- name: Check if Zig 0.16.0 already installed
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.local/zig-0.16.0/zig"
  register: zig_installed

- name: Install Zig 0.16.0 (OpenBSD's packaged zig is stuck on 0.15.x; oxwm needs 0.16+)
  when: not zig_installed.stat.exists
  block:
    # Not /tmp: OpenBSD's auto-partitioning gives /tmp a small, roughly
    # fixed-size allocation (~500-600MB seen in testing) regardless of
    # overall disk size, and this download (57MB compressed) plus its
    # extracted contents (399MB) need to coexist there at once - tight
    # enough that a real run silently extracted some files but not "zig"
    # itself, with no task-level failure to point at it (root cause traced
    # by manually reproducing the same sequence and hitting "No space left
    # on device" partway through, on a partition of comparable size). /home
    # doesn't have this fixed-small-allocation problem.
    - name: Ensure extract dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "/home/{{ ansible_user }}/.local/zig-0.16.0"
        - "/home/{{ ansible_user }}/.cache/zigextract"

    - name: Download Zig 0.16.0 OpenBSD build
      ansible.builtin.get_url:
        url: https://ziglang.org/download/0.16.0/zig-x86_64-openbsd-0.16.0.tar.xz
        dest: "/home/{{ ansible_user }}/.cache/zig-0.16.0.tar.xz"
        mode: "0644"

    # Base tar has no -J (or --strip-components - checked, OpenBSD's
    # bsdtar doesn't have it), hence xz|tar then a separate move.
    - name: Extract (base tar has no -J; xz then tar)
      ansible.builtin.shell: "xz -dc /home/{{ ansible_user }}/.cache/zig-0.16.0.tar.xz | tar -xf - -C /home/{{ ansible_user }}/.cache/zigextract"
      changed_when: true

    # The exact extracted directory name, not a /*/* wildcard glob, for an
    # unambiguous, known-exact source path.
    - name: Move extracted contents into place
      ansible.builtin.shell: "mv /home/{{ ansible_user }}/.cache/zigextract/zig-x86_64-openbsd-0.16.0/* /home/{{ ansible_user }}/.local/zig-0.16.0/"
      changed_when: true

    - name: Clean up
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/home/{{ ansible_user }}/.cache/zigextract"
        - "/home/{{ ansible_user }}/.cache/zig-0.16.0.tar.xz"

    # Relative target, not absolute - onetime-account-setup.sh renames the
    # bootstrap account (and moves its home dir) after provisioning, which
    # doesn't update an absolute symlink target's stored string, leaving it
    # pointing at the old (now nonexistent) /home/setup/... path. A
    # relative target survives the move since it's resolved from the
    # symlink's own location, not affected by the parent directory being
    # renamed.
    - name: Symlink zig into ~/bin
      ansible.builtin.file:
        src: "../.local/zig-0.16.0/zig"
        dest: "/home/{{ ansible_user }}/bin/zig"
        state: link

- name: Check if oxwm already built
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.local/bin/oxwm"
  register: oxwm_built

- name: Build oxwm
  when: not oxwm_built.stat.exists
  block:
    - name: Clone oxwm
      ansible.builtin.git:
        repo: https://github.com/tonybanters/oxwm
        dest: "/home/{{ ansible_user }}/src/oxwm"
        depth: 1

    # Upstream build.zig doesn't link everything OpenBSD's static X11/font
    # libs transitively need, and defaults to use_lld=false which produces
    # a binary missing the .note.openbsd.ident segment the kernel requires
    # to exec anything directly ("Exec format error" otherwise). This is
    # the exact working version from today.
    - name: Install patched build.zig
      ansible.builtin.copy:
        src: build.zig
        dest: "/home/{{ ansible_user }}/src/oxwm/build.zig"
        mode: "0644"

    - name: Get OpenBSD release version for the build target
      ansible.builtin.command: uname -r
      register: openbsd_release
      changed_when: false

    - name: Build oxwm
      ansible.builtin.command: >
        /home/{{ ansible_user }}/.local/zig-0.16.0/zig build
        -Dtarget=x86_64-openbsd.{{ openbsd_release.stdout }}
        --prefix /home/{{ ansible_user }}/.local
      args:
        chdir: "/home/{{ ansible_user }}/src/oxwm"
      changed_when: true
